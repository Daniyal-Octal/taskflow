name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build Docker image (PRs only, main builds in the push job)
        if: github.event_name == 'pull_request'
        run: docker build -t taskflow-api .

  push-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # lets the job request GitHub's signed identity token
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Get AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::882166533223:role/taskflow-github-ci
          aws-region: us-east-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: backend
        run: |
          REPO=882166533223.dkr.ecr.us-east-1.amazonaws.com/taskflow
          TAG="sha-${GITHUB_SHA::7}"
          docker build --provenance=false --sbom=false -t $REPO:$TAG .
          docker push $REPO:$TAG
